# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Ignorados de forma consciente (revisar a cada release; ver docs/DEPENDENCIAS.md):
ignore = [
    # rsa (via russh/ssh-key): ataque de timing "Marvin" em chaves RSA; sem correção upstream.
    # Afeta assinatura/decifragem RSA local; RISCO REAL ACEITADO ate russh trocar de implementacao.
    { id = "RUSTSEC-2023-0071", reason = "sem correcao upstream; dependencia transitiva de russh" },
    # Apenas ferramenta de desenvolvimento (tools/icon -> resvg); nao vai no binario.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz so em tools/icon (gerador de icone)" },
    # ttf-parser: tambem via winit/sctk-adwaita (Linux/Wayland); sem substituto upstream ainda.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained; transitiva de winit/resvg, sem alternativa upstream" },
]

[licenses]
# crates do workspace com publish = false (poc, tools) sem campo license
private = { ignore = true }
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    # Fontes embutidas do egui (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
