name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Dependências de sistema para eframe/winit/wgpu (X11/Wayland/Vulkan).
      # keyring e rfd usam zbus/ashpd (Rust puro): não exigem libdbus nem GTK.
      # mesa-vulkan-drivers (lavapipe) permite os testes egui_kittest/wgpu sem GPU.
      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (sem testes de servidor real)
        run: cargo test --workspace
      - name: cargo build --release
        run: cargo build --release -p myssh-app

  integration-linux:
    name: integração (servidor SSH em docker)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers
      - name: Subir testenv (somente desenvolvimento)
        run: ./testenv/up.sh
      - name: Testes ignorados (servidor real)
        env:
          MYSSH_TEST_SSH: 127.0.0.1:2222
          MYSSH_TEST_KEYS: ${{ github.workspace }}/testenv/keys
        run: cargo test --workspace -- --ignored --test-threads=1

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
