name: Release

# Disparo manual ou por tag vX.Y.Z.
#
# IMPORTANTE: SEM os secrets de assinatura (APPLE_CERTIFICATE, WINDOWS_CERTIFICATE...)
# os artefatos saem SEM ASSINATURA: o macOS mostrará o aviso do Gatekeeper e o
# Windows o SmartScreen. Os passos de assinatura abaixo estão comentados e só devem
# ser habilitados quando os secrets existirem.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: pacote ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: app,dmg
          - os: windows-latest
            formats: nsis,wix
          - os: ubuntu-latest
            formats: deb,appimage
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libfuse2

      - name: Instalar cargo-packager
        run: cargo install cargo-packager --locked

      # --- macOS: assinatura e notarização (OPCIONAL; habilitar com secrets) ---
      # Secrets: APPLE_CERTIFICATE (p12 em base64), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
      # O cargo-packager lê estas variáveis de ambiente e assina/notariza sozinho.
      # - name: Importar certificado Apple
      #   if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   run: |
      #     echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
      #     security create-keychain -p ci build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p ci build.keychain
      #     security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      #     rm cert.p12

      # --- Windows: assinatura (OPCIONAL; habilitar com secrets) ---
      # Secrets: WINDOWS_CERTIFICATE (pfx em base64) e WINDOWS_CERTIFICATE_PASSWORD;
      # depois configurar o thumbprint em `[package.metadata.packager.windows]`.
      # - name: Importar certificado Windows
      #   if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   shell: pwsh
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
      #     Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My `
      #       -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

      - name: Empacotar (sem assinatura)
        run: cargo packager --release -p myssh-app --formats ${{ matrix.formats }} --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: mySSH-${{ matrix.os }}-NAO-ASSINADO
          path: dist/*
          if-no-files-found: error

  publish:
    name: anexar à release (rascunho)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: "Artefatos NÃO assinados (sem certificados configurados)."
          files: dist/**/*
