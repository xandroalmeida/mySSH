[package]
name = "myssh-aws"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Transporte AWS SSM Session Manager (Rust puro) e login IAM Identity Center do mySSH"

[dependencies]
myssh-core = { path = "../core" }
myssh-i18n = { path = "../i18n" }
myssh-secrets = { path = "../secrets" }
myssh-ssh = { path = "../ssh" }
aws-config = { version = "1.13", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-ssm = "1.130"
aws-sdk-ec2instanceconnect = "1.117"
aws-sdk-sso = "1.116"
aws-sdk-ssooidc = "1.118"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
secrecy = "0.10"
zeroize = "1"
directories = "6"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
