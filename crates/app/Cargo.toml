[package]
name = "myssh-app"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Aplicativo desktop mySSH (casca: perfis, abas, configurações)"
publish = false

[[bin]]
name = "myssh"
path = "src/main.rs"

[features]
# Ganchos de demonstração/teste (MYSSH_DEMO_SHOTS, MYSSH_DEMO_SSH, aceitação automática de
# host key). Sempre presentes em builds de debug e de teste; em release só com `--features demo`.
default = []
demo = []

[dependencies]
myssh-core = { path = "../core" }
myssh-store = { path = "../store" }
myssh-secrets = { path = "../secrets" }
myssh-ssh = { path = "../ssh" }
myssh-term = { path = "../term" }
myssh-transfer = { path = "../transfer" }
myssh-syncrun = { path = "../syncrun" }
tokio-util = { version = "0.7", default-features = false }
myssh-sshconfig = { path = "../sshconfig" }
eframe = "0.36"
egui = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs"] }
chrono = "0.4"
directories = "6"
rfd = "0.17"
secrecy = "0.10"
zeroize = "1"
png = "0.18"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# macOS: `cargo packager --release` (cargo-packager) gera o .app com icon.icns.
[package.metadata.packager]
product-name = "mySSH"
identifier = "com.myssh.app"
icons = ["assets/icon.icns", "assets/icon.ico", "assets/icon-256.png"]
category = "DeveloperTool"

# Linux (hicolor): instalar assets/icon-<N>.png em
# /usr/share/icons/hicolor/<N>x<N>/apps/myssh.png e assets/myssh.desktop em
# /usr/share/applications/.
