[package]
name = "myssh-term"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal do mySSH: emulação (alacritty_terminal) + widget egui sobre uma sessão myssh-ssh"

[dependencies]
myssh-core = { path = "../core" }
myssh-ssh = { path = "../ssh" }
egui = "0.36"
alacritty_terminal = "0.26"
secrecy = "0.10"

[dev-dependencies]
ttf-parser = "0.25"
myssh-store = { path = "../store" }
eframe = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs"] }
russh = "0.64"
