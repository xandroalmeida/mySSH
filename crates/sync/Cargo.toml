[package]
name = "myssh-sync"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Núcleo de planejamento de sincronização unidirecional (sem rede) do mySSH"

[dependencies]
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "rt", "macros"] }
