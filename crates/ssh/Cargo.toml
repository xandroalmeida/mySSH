[package]
name = "myssh-ssh"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Sessão SSH (russh) do mySSH: conexão, host trust, autenticação e PTY, sem dependência de UI"

[dependencies]
myssh-core = { path = "../core" }
russh = "0.64"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs"] }
secrecy = "0.10"
zeroize = "1"

[dev-dependencies]
myssh-store = { path = "../store" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs", "io-util"] }
