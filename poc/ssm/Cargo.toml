[package]
name = "poc-ssm"
version = "0.1.0"
edition = "2024"
publish = false
description = "POC: SSH sobre AWS SSM Session Manager em Rust puro (sem aws CLI / session-manager-plugin)"

[[bin]]
name = "poc-ssm"
path = "src/main.rs"

[lib]
name = "poc_ssm"
path = "src/lib.rs"

[dependencies]
myssh-ssh = { path = "../../crates/ssh" }
aws-config = { version = "1.13", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-ssm = "1.130"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
secrecy = "0.10"
anyhow = "1"
russh = "0.64"
